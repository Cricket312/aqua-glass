[workspace]
members = ["crates/aqua-core", "crates/aqua-providers", "crates/aqua-radio"]
resolver = "2"

[workspace.package]
version = "0.10.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
rand = "0.9"
url = "2"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "form", "charset", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# The desktop app (Windows 11) is the root package; portable code lives in crates/.
[package]
name = "aqua-glass"
description = "Aqua Glass - a lightweight native Spotify + YouTube Music client for Windows 11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["spotify-playback", "local-files"]
# librespot-based Spotify Premium playback. Without it, Spotify library/sync/transfer still work.
spotify-playback = ["dep:librespot-core", "dep:librespot-playback", "dep:librespot-metadata"]
# Local audio file playback (symphonia decoders).
local-files = ["dep:symphonia"]
# Screen-reader support (adds AccessKit; costs a few MB).
accessibility = ["eframe/accesskit"]

[dependencies]
aqua-core = { path = "crates/aqua-core" }
aqua-providers = { path = "crates/aqua-providers" }
aqua-radio = { path = "crates/aqua-radio" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
log = "0.4"
directories = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query", "form", "charset", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rustfft = "6"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
open = "5"
csv = "1"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
simplelog = "0.12"

librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aac", "isomp4"], optional = true }
cpal = "0.18.2"
# WebSocket client for Spotify Soloist's local API (plain ws:// on 127.0.0.1, no TLS needed)
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
global-hotkey = "0.10.0"
keyring = { version = "3.6.3", features = ["windows-native"] }
raw-window-handle = "0.6"
rfd = "0.17.2"
souvlaki = "0.8.3"
tauri-winrt-notification = "0.8.1"
tray-icon = "0.24.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_JobObjects", "Win32_Security"] }
winreg = "0.56.0"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# Linux is only used for development/CI (tests, headless measurements).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "clipboard"] }
